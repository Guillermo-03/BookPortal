services:
  book-portal-db:
    image: mysql:8.0
    container_name: "book-portal-db"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: book_portal
      MYSQL_USER: bookportal
      MYSQL_PASSWORD: bookportal
    volumes:
      # SQL dumps from dbData.zip; run once, on first start with an empty volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  book-portal-be:
    build: ./book-portal-be
    image: iammemo/book-portal-be:latest
    container_name: "book-portal-be"
    restart: unless-stopped
    environment:
      # Overrides the dead Azure MySQL settings in application.yaml
      SPRING_DATASOURCE_URL: jdbc:mysql://book-portal-db:3306/book_portal?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bookportal
      SPRING_DATASOURCE_PASSWORD: bookportal
    depends_on:
      book-portal-db:
        condition: service_healthy

  book-portal-fe:
    build: ./book-portal-fe
    image: iammemo/book-portal-fe:latest
    container_name: "book-portal-fe"
    restart: unless-stopped
    depends_on:
      - book-portal-be

  proxy:
    build: ./nginx
    image: iammemo/book-portal-proxy:latest
    container_name: "book-portal-proxy"
    restart: always
    ports:
      - "80:80"
    depends_on:
      - book-portal-fe
      - book-portal-be

volumes:
  db-data:
